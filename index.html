<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://gorythmacademy.com/" />
    <meta
      name="description"
      content="Built with Signs. Discover Yourself. Gorythm Academy develops IQ, EQ, and PhQ through structured courses and research rooted in timeless principles for whole-person growth."
    />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Web app manifest (installable app metadata). Files in `public/` are served from the site root. -->
    <link rel="manifest" href="/manifest.json" />
    <title>Gorythm Academy | Online Education Platform</title>
    <style>
      html, body { margin: 0; }
      html.route-light { background: #f8f8f8; }
      html.route-dark { background: #000; }
      html.route-no-header .header { display: none !important; }
      .header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: transparent; }
      .hero-section-enhanced { position: relative; min-height: 100svh; overflow: hidden; background: #000; color: #fff; }
      .particles-container, .hero-background { position: absolute; inset: 0; }
      .particle { position: absolute; }
      .scroll-to-top { opacity: 0; visibility: hidden; }
      .hero-background-picture, .hero-background-fill { display: block; width: 100%; height: 100%; object-fit: cover; }
      html.cookie-boot-hide #cookie-boot { display: none !important; }
      #cookie-boot {
        position: fixed; z-index: 80; right: 16px; bottom: 16px; left: 16px; max-width: 520px;
        margin-left: auto; padding: 16px 18px; border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 12px; background: rgba(12, 12, 12, 0.96); color: rgba(255, 255, 255, 0.88);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); font-family: Nunito, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #cookie-boot p { margin: 0 0 12px; font-size: 0.84rem; line-height: 1.5; }
      #cookie-boot a { color: #c5a45c; }
      #cookie-boot .cookie-boot-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
      #cookie-boot button {
        min-height: 44px; padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer;
      }
      #cookie-boot [data-cookie-choice="all"] { border: 0; background: #c5a45c; color: #111; }
      #cookie-boot [data-cookie-choice="essential"] { border: 1px solid rgba(255, 255, 255, 0.22); background: transparent; color: #fff; }
    </style>
    <script>
      (function () {
        var path = location.pathname || '/';
        var root = document.documentElement;
        var admin = path.indexOf('/admin') === 0;
        var portal = /^\/(student|teacher|parent|accountant)(\/|$)/.test(path);
        var login = path === '/login' || path === '/forgot-password' || path === '/reset-password';
        var dark = path === '/' || path === '/about' || path === '/contact' || path === '/courses' || path === '/research' || path === '/payment' || path === '/payment-success' || path === '/payment-cancel' || path.indexOf('/courses/') === 0 || path.indexOf('/research/') === 0 || path.indexOf('/mission/') === 0;
        root.classList.add(dark ? 'route-dark' : 'route-light');
        if (admin || portal || login) root.classList.add('route-no-header');
        var key = 'gorythm_cookie_consent_v1';
        var hideCookie = admin || portal;
        try {
          if (!hideCookie && localStorage.getItem(key)) hideCookie = true;
        } catch (e) {}
        if (hideCookie) root.classList.add('cookie-boot-hide');
        if (path === '/') {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = '/preload/lcp-hero.avif';
          link.type = 'image/avif';
          link.setAttribute('fetchpriority', 'high');
          document.head.appendChild(link);
        }
        document.addEventListener('click', function (event) {
          var node = event.target;
          var button = null;
          while (node && node !== document) {
            if (node.getAttribute && node.getAttribute('data-cookie-choice')) {
              button = node;
              break;
            }
            node = node.parentNode;
          }
          if (!button) return;
          var choice = button.getAttribute('data-cookie-choice');
          try {
            localStorage.setItem(key, JSON.stringify({
              essential: true,
              media: choice === 'all',
              choice: choice,
              at: new Date().toISOString()
            }));
          } catch (e) {}
          root.classList.add('cookie-boot-hide');
          window.dispatchEvent(new Event('gorythm-cookie-consent'));
        });
      })();
    </script>
  </head>
  <body>
    <div id="cookie-boot" role="dialog" aria-label="Cookie consent">
      <p>
        We use essential storage for login, checkout, and basic site functions. Stripe checkout may
        set cookies to take payment. YouTube and Vimeo videos load only if you accept.
        <a href="/cookies" target="_blank" rel="noopener noreferrer">Cookie policy</a>
      </p>
      <div class="cookie-boot-actions">
        <button type="button" data-cookie-choice="essential">Essential only</button>
        <button type="button" data-cookie-choice="all">Accept</button>
      </div>
    </div>

    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
